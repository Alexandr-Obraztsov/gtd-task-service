# nginx внутри контейнера клиента: только статика React и fallback для React Router.
# API обслуживается отдельным именем api.<домен> (см. deploy/nginx/gtd.conf).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Файлы сборки с хешем в имени — кешируются надолго
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Любой другой путь отдаёт index.html, маршрутизацию выполняет React Router
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
