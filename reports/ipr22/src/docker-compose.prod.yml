# Продакшен-окружение GTD Task Service на собственном VPS.
# На сервере (из каталога репозитория):
#   cp deploy/.env.prod.example .env && chmod 600 .env   # заполнить секреты один раз
#   docker compose -f docker-compose.prod.yml up -d --build
# Все порты открыты только на 127.0.0.1: HTTPS принимает nginx хоста и проксирует
# имена gtd / api.gtd / uptime.gtd / errors.gtd / logs.gtd (deploy/nginx/gtd.conf).
name: gtd-prod

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-glitchtip.sh:/docker-entrypoint-initdb.d/10-glitchtip.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m

  api:
    build: .
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 1            # перед API только nginx хоста
      RELEASE: ${APP_VERSION:-dev}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"     # БД в той же сети Docker, наружу не открыта
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: https://${APP_DOMAIN}
      LOG_LEVEL: info
      METRICS_TOKEN: ${METRICS_TOKEN}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      LOKI_URL: http://loki:3100
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_MODERATOR_EMAIL: ${SEED_MODERATOR_EMAIL}
      SEED_MODERATOR_PASSWORD: ${SEED_MODERATOR_PASSWORD}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
    ports:
      - "127.0.0.1:8121:3000"
    depends_on:
      postgres: { condition: service_healthy }
      loki: { condition: service_started }
    mem_limit: 256m

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: https://api.${APP_DOMAIN}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8120:80"
    mem_limit: 64m

  # ---- наблюдаемость ----
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9-slim
    restart: unless-stopped
    logging: *logging
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    ports:
      - "127.0.0.1:8122:3001"
    volumes:
      - kuma:/app/data
    mem_limit: 256m

  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      SERVER_ROLE: all_in_one   # веб, воркер и планировщик в одном процессе
      VALKEY_URL: ""            # без Redis: очередь и кеш хранятся в PostgreSQL
      GRANIAN_WORKERS_MAX_RSS: "400"
      ALLOWED_HOSTS: errors.${APP_DOMAIN},glitchtip,localhost,127.0.0.1   # glitchtip — приём ошибок API по внутренней сети
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: https://errors.${APP_DOMAIN}
      DEFAULT_FROM_EMAIL: glitchtip@${APP_DOMAIN}
      EMAIL_URL: consolemail://
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      GLITCHTIP_RETENTION_DAYS: "30"
      PORT: 8000
    ports:
      - "127.0.0.1:8123:8000"
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 512m

  loki:
    image: grafana/loki:3.6.21
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./deploy/loki/config.yml:/etc/loki/config.yml:ro
      - loki:/loki
    mem_limit: 256m

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SERVER_ROOT_URL: https://logs.${APP_DOMAIN}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:8124:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [loki]
    mem_limit: 384m

# Подсеть задана явно: стандартные пулы адресов Docker на сервере исчерпаны.
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-10.203.120.0/24}

volumes:
  pgdata:
  kuma:
  loki:
  grafana:
