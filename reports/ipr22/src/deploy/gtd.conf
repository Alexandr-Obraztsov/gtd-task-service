# nginx хоста (VPS): HTTPS для GTD Task Service и сервисов наблюдения.
# Устанавливается скриптом deploy/setup-host.sh; сертификат Let's Encrypt (certbot, webroot).
# Контейнеры слушают только 127.0.0.1 (см. docker-compose.prod.yml).

server {
    listen 80;
    listen [::]:80;
    server_name gtd.cloudyyy.tech api.gtd.cloudyyy.tech uptime.gtd.cloudyyy.tech errors.gtd.cloudyyy.tech logs.gtd.cloudyyy.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Фронтенд: статическая сборка React
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gtd.cloudyyy.tech;
    include /etc/nginx/snippets/gtd-tls.conf;

    location / {
        proxy_pass http://127.0.0.1:8120;
        include /etc/nginx/snippets/gtd-proxy.conf;
    }
}

# Бэкенд: REST API, /health, /metrics, /dashboard, /api-docs
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.gtd.cloudyyy.tech;
    include /etc/nginx/snippets/gtd-tls.conf;
    client_max_body_size 64k;   # API принимает только небольшие JSON-тела

    location / {
        proxy_pass http://127.0.0.1:8121;
        include /etc/nginx/snippets/gtd-proxy.conf;
    }
}

# Мониторинг доступности (Uptime Kuma)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uptime.gtd.cloudyyy.tech;
    include /etc/nginx/snippets/gtd-tls.conf;

    location / {
        proxy_pass http://127.0.0.1:8122;
        include /etc/nginx/snippets/gtd-proxy.conf;
    }
}

# Сбор ошибок (GlitchTip)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name errors.gtd.cloudyyy.tech;
    include /etc/nginx/snippets/gtd-tls.conf;
    client_max_body_size 20M;   # конверты Sentry SDK

    location / {
        proxy_pass http://127.0.0.1:8123;
        include /etc/nginx/snippets/gtd-proxy.conf;
    }
}

# Журналы (Grafana поверх Loki)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logs.gtd.cloudyyy.tech;
    include /etc/nginx/snippets/gtd-tls.conf;

    location / {
        proxy_pass http://127.0.0.1:8124;
        include /etc/nginx/snippets/gtd-proxy.conf;
    }
}
