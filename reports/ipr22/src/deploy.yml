name: CI/CD

# Каждый push и pull request проходит линтинг, тесты и сборку образов.
# Push в main, ipr22 и ipr22-vps дополнительно разворачивается на VPS.
# Итог любого push отправляется в Telegram.
on:
  push:
    branches: [main, ipr22, ipr22-vps]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # устаревшие проверки PR отменяются, начатый деплой не прерывается
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  APP_URL: https://gtd.cloudyyy.tech
  API_URL: https://api.gtd.cloudyyy.tech

jobs:
  test:
    name: API — ESLint и тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gtd
          POSTGRES_PASSWORD: gtd_ci_password
          POSTGRES_DB: gtd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gtd -d gtd_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Значения только для тестового прогона в изолированном контейнере CI
      DATABASE_URL: postgres://gtd:gtd_ci_password@127.0.0.1:5432/gtd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Тесты (Jest + supertest)
        run: npm run test:ci

  client:
    name: Клиент — сборка Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Установка зависимостей
        run: npm ci
      - name: Сборка
        run: npm run build
        env:
          VITE_API_URL: ${{ env.API_URL }}

  images:
    name: Сборка Docker-образов
    runs-on: ubuntu-latest
    needs: [test, client]
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образов api и web из docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml build api web
        env:
          APP_DOMAIN: gtd.cloudyyy.tech
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
      - name: Проверка запуска образа API
        run: docker run --rm --entrypoint node gtd-prod-api -e "require('winston-loki'); console.log('node', process.version, 'ok')"

  deploy:
    name: Деплой на VPS
    runs-on: ubuntu-latest
    needs: [images]
    if: >-
      github.event_name == 'push' &&
      contains(fromJSON('["main","ipr22","ipr22-vps"]'), github.ref_name)
    environment:
      name: production
      url: https://gtd.cloudyyy.tech
    env:
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Деплой пропущен (секрет VPS_SSH_KEY не задан)
        if: env.SSH_KEY == ''
        run: echo "::notice::Секрет VPS_SSH_KEY не задан — деплой пропущен"

      # Ключ может выполнить на сервере только deploy/deploy.sh (forced command в authorized_keys)
      - name: Деплой по SSH
        if: env.SSH_KEY != ''
        env:
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          HOST: ${{ vars.VPS_HOST }}
          PORT: ${{ vars.VPS_PORT }}
          USER: ${{ vars.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$HOST" "deploy ${GITHUB_REF_NAME}"

      - name: Проверка по HTTPS
        if: env.SSH_KEY != ''
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$API_URL/health/ready"; echo
          curl -fsS -o /dev/null -w "frontend: %{http_code}\n" "$APP_URL/"

  notify:
    name: Уведомление в Telegram
    runs-on: ubuntu-latest
    needs: [test, client, images, deploy]
    if: always() && github.event_name == 'push'
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      R_TEST: ${{ needs.test.result }}
      R_CLIENT: ${{ needs.client.result }}
      R_IMAGES: ${{ needs.images.result }}
      R_DEPLOY: ${{ needs.deploy.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Отправка итога сборки
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::Telegram не настроен — уведомление пропущено"; exit 0
          fi
          case " $R_TEST $R_CLIENT $R_IMAGES $R_DEPLOY " in
            *" failure "*)   STATUS="🔴 Сборка упала" ;;
            *" cancelled "*) STATUS="⚪ Сборка отменена" ;;
            *)               STATUS="🟢 Сборка прошла" ;;
          esac
          mark() { case "$1" in success) echo "✔";; skipped) echo "—";; *) echo "✘ $1";; esac; }
          TEXT=$(printf '%s · GTD Task Service\nВетка: %s\nКоммит: %s %s\nАвтор: %s\n\nТесты API: %s\nКлиент: %s\nОбразы: %s\nДеплой: %s\n\n%s' \
            "$STATUS" "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" "${COMMIT_MSG%%$'\n'*}" "$GITHUB_ACTOR" \
            "$(mark "$R_TEST")" "$(mark "$R_CLIENT")" "$(mark "$R_IMAGES")" "$(mark "$R_DEPLOY")" "$RUN_URL")
          curl --fail --silent --show-error --max-time 30 --retry 4 --retry-delay 5 --retry-all-errors \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
          echo "Уведомление отправлено: $STATUS"
