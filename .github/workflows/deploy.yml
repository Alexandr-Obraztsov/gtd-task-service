name: CI/CD

# Полный цикл запускается при push в main и вручную. Для pull request
# выполняются только проверки (lint, тесты, сборка образа) — без деплоя.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # отменяем устаревшие проверки pull request, но не прерываем начатый деплой
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Lint и тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gtd
          POSTGRES_PASSWORD: gtd_ci_password
          POSTGRES_DB: gtd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gtd -d gtd_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Значения только для тестового прогона в изолированном контейнере CI.
      DATABASE_URL: postgres://gtd:gtd_ci_password@127.0.0.1:5432/gtd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Тесты (Jest + supertest)
        run: npm run test:ci

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Сборка образа (без публикации)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gtd-task-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Проверка запуска контейнера
        run: |
          docker image inspect "gtd-task-service:${GITHUB_SHA}" --format 'Размер образа: {{.Size}} байт'
          docker run --rm --entrypoint node "gtd-task-service:${GITHUB_SHA}" -e "console.log('node', process.version, 'ok')"

  deploy-backend:
    name: Деплой бэкенда (Render)
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name != 'pull_request'
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Запуск деплоя через Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Деплой на Render запущен"
      - name: Деплой пропущен (секрет RENDER_DEPLOY_HOOK_URL не задан)
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "::notice::Секрет RENDER_DEPLOY_HOOK_URL не задан — деплой пропущен"
      - name: Проверка работоспособности после деплоя (/health)
        if: env.RENDER_DEPLOY_HOOK_URL != '' && env.PRODUCTION_URL != ''
        run: |
          # Бесплатный план Render собирает образ несколько минут и «просыпается» до минуты.
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 15 "${PRODUCTION_URL%/}/health" | grep -q '"status":"ok"'; then
              echo "Сервис отвечает (попытка $attempt)"
              exit 0
            fi
            echo "Сервис пока не отвечает, попытка $attempt из 30"
            sleep 20
          done
          echo "::error::Сервис не ответил на /health за 10 минут"
          exit 1

  deploy-frontend:
    name: Деплой фронтенда (Vercel)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Проверка наличия клиента и секретов
        id: gate
        run: |
          if [ ! -f client/package.json ]; then
            echo "::notice::Папки client/ нет в этой ветке — деплой фронтенда пропущен"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Секреты VERCEL_* не заданы — деплой фронтенда пропущен"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Установка Vercel CLI
        if: steps.gate.outputs.run == 'true'
        run: npm install --global vercel@latest
      - name: Получение настроек проекта Vercel
        if: steps.gate.outputs.run == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Сборка
        if: steps.gate.outputs.run == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Выгрузка в продакшен
        if: steps.gate.outputs.run == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  notify:
    name: Уведомление в Telegram
    runs-on: ubuntu-latest
    needs: [test, docker, deploy-backend, deploy-frontend]
    if: always()
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RESULTS: ${{ join(needs.*.result, ' ') }}
      REPO: ${{ github.repository }}
      REF_NAME: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      ACTOR: ${{ github.actor }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Отправка статуса сборки
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          case " $RESULTS " in
            *" failure "*)   STATUS="ПРОВАЛ" ;;
            *" cancelled "*) STATUS="ОТМЕНЕНА" ;;
            *)               STATUS="УСПЕХ" ;;
          esac
          TEXT=$(printf 'Сборка GTD Task Service: %s\nРепозиторий: %s\nВетка: %s\nКоммит: %s\nАвтор: %s\nРезультаты задач: %s\n%s' \
            "$STATUS" "$REPO" "$REF_NAME" "${SHA:0:7}" "$ACTOR" "$RESULTS" "$RUN_URL")
          curl --fail --silent --show-error --max-time 30 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
          echo "Уведомление отправлено: $STATUS"
      - name: Уведомление пропущено (секреты Telegram не заданы)
        if: env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == ''
        run: echo "::notice::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID не заданы — уведомление пропущено"
