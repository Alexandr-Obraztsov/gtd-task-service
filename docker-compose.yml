name: gtd-task-service

services:
  postgres:
    image: postgres:16-alpine
    container_name: gtd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gtd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtd_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gtd}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
